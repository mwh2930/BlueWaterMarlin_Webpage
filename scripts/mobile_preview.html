<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BlueWater Marlin — Mobile Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px 12px 36px;
      background:
        radial-gradient(circle at 50% 0, rgba(41, 151, 255, .13), transparent 34rem),
        #070709;
      color: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(390px, 100%);
      margin: 0 auto 12px;
      color: #a1a1a6;
      font-size: 12px;
      letter-spacing: -.01em;
    }
    header strong {
      color: #f5f5f7;
      font-size: 13px;
      font-weight: 600;
    }
    button {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      color: #d1d1d6;
      font: inherit;
      cursor: pointer;
    }
    .phone {
      width: min(390px, 100%);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 30px;
      background: #000;
      box-shadow: 0 30px 90px -34px #000, 0 0 0 1px rgba(0, 0, 0, .72);
    }
    iframe {
      display: block;
      width: 100%;
      height: min(844px, calc(100vh - 92px));
      min-height: 640px;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <header>
    <div><strong>Mobile preview</strong> · 390 px</div>
    <button type="button" id="refresh">Refresh</button>
  </header>
  <main class="phone">
    <iframe id="preview" src="/?live_preview=1&amp;mobile_preview=1" title="BlueWater Marlin mobile preview"></iframe>
  </main>
  <script>
    document.getElementById("refresh").addEventListener("click", () => {
      document.getElementById("preview").src = `/?live_preview=1&mobile_preview=${Date.now()}`;
    });
  </script>
</body>
</html>
